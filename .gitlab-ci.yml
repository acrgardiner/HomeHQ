default:
    tags: [projectaardvarkx2]

stages:
    - debug
    - build
    - package

debug:
    stage: debug
    script:
        - export
    rules:
        - if: $DEBUG

build:
    stage: build
    image: mcr.microsoft.com/dotnet/sdk:9.0
    script:
        - dotnet build

docker image:
    stage: package
    image: docker:24.0.5
    services:
      - docker:24.0.5-dind
    variables:
    #  DOCKER_HOST: tcp://docker:2375
    #  DOCKER_TLS_CERTDIR: ""
      DOCKER_TLS_CERTDIR: "/certs"
    script:
        #- until docker info; do sleep 1; done
        - docker info
        - >
            if [[ $CI_COMMIT_TAG != '' ]]; then
                IMAGE_TAG=${CI_COMMIT_TAG//[^a-zA-Z0-9-._]/_}
            elif [[ $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH ]]; then
                IMAGE_TAG=latest
            else
                IMAGE_TAG=${CI_COMMIT_BRANCH//[^a-zA-Z0-9-._]/_}
            fi
        - echo "$CI_JOB_TOKEN" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
        - docker build --build-arg COMMIT_SHA="$CI_COMMIT_SHA" --tag $CI_REGISTRY_IMAGE:$IMAGE_TAG .
        #--t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
        - docker image ls
        - docker push $CI_REGISTRY_IMAGE --all-tags
    rules:
        - if: $CI_COMMIT_TAG
          when: on_success
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
          when: on_success
        - if: $CI_COMMIT_BRANCH =~ /dev\/.*/
          when: manual
