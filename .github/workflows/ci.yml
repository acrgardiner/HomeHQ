name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - 'dev/**'
    tags:
      - '*'
  pull_request:
    branches:
      - main
      - master

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  debug:
    name: Debug Info
    runs-on: ubuntu-latest
    if: ${{ vars.DEBUG == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Print environment variables
        run: env | sort

  build:
    name: Build .NET Project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore HomeHQ.Server/HomeHQ.Server.csproj

      - name: Build project
        run: dotnet build HomeHQ.Server/HomeHQ.Server.csproj --configuration Release --no-restore

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: build
    if: |
      github.event_name == 'push' && (
        github.ref_type == 'tag' ||
        github.ref_name == 'main' ||
        github.ref_name == 'master' ||
        startsWith(github.ref_name, 'dev/')
      )
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref_name == github.event.repository.default_branch || github.ref_name == 'main' || github.ref_name == 'master' }}
            type=ref,event=branch

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-android-apk:
    name: Build Android APK (Release)
    runs-on: ubuntu-latest
    needs: build
    if: |
      github.event_name == 'push' && (
        github.ref_type == 'tag' ||
        github.ref_name == 'main' ||
        github.ref_name == 'master' ||
        startsWith(github.ref_name, 'dev/')
      )
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK command-line tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip curl
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk
          curl -o commandlinetools.zip https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip -q commandlinetools.zip -d cmdline-tools
          mkdir -p cmdline-tools/latest
          mv cmdline-tools/cmdline-tools/* cmdline-tools/latest/ || true
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      - name: Accept Android SDK licenses
        run: |
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup .NET 10.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install .NET MAUI workloads
        run: |
          dotnet workload restore
          dotnet workload install maui-android || true

      - name: Publish Android APK (Release)
        env:
          ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
        run: |
          # Adjust the project path if your MAUI Android project file is located elsewhere
          dotnet publish HomeHQ.Mobile/HomeHQ.Mobile.csproj -f net10.0-android -c Release -p:AndroidPackageFormat=apk -o ./artifacts/android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: homehq-android-apk
          path: artifacts/android

